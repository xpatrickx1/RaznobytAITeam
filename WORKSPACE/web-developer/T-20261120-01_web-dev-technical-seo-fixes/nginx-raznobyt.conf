# =====================================================================
# raznobyt.com — фрагмент конфігу nginx для T-20261120-01
# (SEO-ТЗ T-20261119-01: завдання 1, 2)
#
# 2026-11-21: блок пагінації ?page=N прибрано, пагінація тепер статична (/page/N/).
#
# Вставити всередину блоку  server { ... }  для raznobyt.com (порт 443, https).
# Чинний конфіг [НЕВІДОМО]: це шаблон, звірити з наявними location перед вставкою.
# Порядок: спершу nginx (nginx -t, потім reload), лише після цього push коду.
# Відкат: прибрати вставлений блок і повернути збережену копію конфігу, nginx -t, reload.
# =====================================================================

# --- Завдання 1.1. Редирект на кінцевий слеш без зміни схеми на http ---
# Location буде відносним (/catalog/), браузер лишається на https.
absolute_redirect off;

# --- Завдання 1.3. Старі адреси меню, що віддають 404 ---
location ~ ^/(ru/)?catalog/personal/?$ { return 301 /$1catalog/sfera-poslug/; }
location ~ ^/(ru/)?catalog/fire/?$     { return 301 /$1catalog/fire-safety/; }

# --- Завдання 2. Кешування ---
# УВАГА 1: якщо на рівні server/http є «expires 30d;», «expires off;» у location нижче його перекриває.
# УВАГА 2: add_header у location скасовує ВСІ add_header рівня server (напр. HSTS).
#          Якщо вони є, продублювати їх у кожному location нижче.

# Файли збірки з хешем у назві: довгий кеш
location /assets/ {
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Службові файли: браузер щоразу перепитує сервер (ETag/Last-Modified уже є)
location = /sitemap.xml  { expires off; add_header Cache-Control "no-cache"; }
location = /robots.txt   { expires off; add_header Cache-Control "no-cache"; }

# --- Завдання 4. Пагінація: nginx НЕ потрібен (з 2026-11-21 статичні сторінки /catalog/<категорія>/page/N/) ---

# HTML-сторінки (усе інше): no-cache. Чинні try_files / index / error_page лишити як є.
location / {
    expires off;
    add_header Cache-Control "no-cache";
    # try_files $uri $uri/ =404;   <- залишити чинний рядок із наявного конфігу
}

# Зображення /images/ (з ?v=) можна лишити з чинним довгим кешем, окремий location не потрібен,
# якщо він уже є. Якщо ні, а «location /» вище його перехоплює, додати:
# location /images/ { expires 30d; }

# =====================================================================
# Якщо доступу до конфігу nginx немає (віртуальний хостинг), текст для підтримки хостингу:
#
# «Прошу для сайту raznobyt.com:
#  1) додати в server-блок "absolute_redirect off;" — редирект на кінцевий слеш має вести
#     на https, а не на http;
#  2) для HTML-сторінок, /sitemap.xml, /robots.txt віддавати
#     "Cache-Control: no-cache" замість max-age=2592000; для /assets/ —
#     "public, max-age=31536000, immutable";
#  3) 301: /catalog/personal → /catalog/sfera-poslug/, /catalog/fire → /catalog/fire-safety/.»
# =====================================================================
